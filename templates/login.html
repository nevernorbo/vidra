{{define "content"}}
<div class="mx-auto max-w-sm pt-8 sm:pt-16">
  <h1 class="page-title">Log in</h1>
  <form method="post" action="/login" class="mt-8 space-y-4">
    {{if .Error}}<p class="alert">{{.Error}}</p>{{end}}
    <div class="field"><input id="u" name="username" class="input peer" placeholder=" " autocomplete="username" autocapitalize="none" required autofocus><label class="float-label" for="u">Username</label></div>
    <div class="field"><input id="p" name="password" type="password" class="input peer" placeholder=" " autocomplete="current-password" required><label class="float-label" for="p">Password</label></div>
    <button class="btn btn-primary btn-lg !mt-6">Log in</button>
  </form>
</div>
{{end}}
