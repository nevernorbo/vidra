<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 8 128 128">
  <!-- vidra's mascot: the Go gopher (by Renée French, CC BY 4.0) wearing an otter hood -->
  <g stroke="#1E1B1E" stroke-width="3.5" stroke-linejoin="round">
    <!-- hood ears -->
    <circle cx="17" cy="47" r="9" fill="#8A5A3B"/>
    <circle cx="111" cy="47" r="9" fill="#8A5A3B"/>
    <circle cx="16" cy="46" r="4" fill="#C9936A" stroke="none"/>
    <circle cx="112" cy="46" r="4" fill="#C9936A" stroke="none"/>
    <!-- hood -->
    <ellipse cx="64" cy="72" rx="56" ry="47" fill="#8A5A3B"/>
    <!-- face showing through the hood -->
    <ellipse cx="64" cy="78" rx="37" ry="35" fill="#7FD3E8" stroke="#C9936A" stroke-width="5"/>
    <!-- eyes, looking in slightly different directions -->
    <circle cx="46" cy="66" r="15" fill="#fff"/>
    <circle cx="84" cy="63" r="16.5" fill="#fff"/>
    <circle cx="51" cy="69" r="5.5" fill="#1E1B1E" stroke="none"/>
    <circle cx="88" cy="60" r="6" fill="#1E1B1E" stroke="none"/>
    <circle cx="53" cy="67" r="1.6" fill="#fff" stroke="none"/>
    <circle cx="90" cy="58" r="1.8" fill="#fff" stroke="none"/>
    <!-- muzzle, nose, buck teeth -->
    <rect x="58.5" y="96" width="11" height="10" rx="2" fill="#fff" stroke-width="2.5"/>
    <ellipse cx="64" cy="91" rx="15" ry="10" fill="#F2D3A4"/>
    <ellipse cx="64" cy="86" rx="6.5" ry="4.5" fill="#3B2A26" stroke="none"/>
    <path d="M64 101v5" fill="none" stroke-width="2"/>
  </g>
  <!-- otter whiskers -->
  <g stroke="#1E1B1E" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M48 89l-17-3M48 94l-16 4"/>
    <path d="M80 89l17-3M80 94l16 4"/>
  </g>
</svg>
